# Dependabot's updates arrive grouped, one pull request per ecosystem per week
# (the corpus's handbook/handoffs/qm-queue.md, decision 5).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
