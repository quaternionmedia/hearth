[project]
name = "qm-hearth"
version = "0.1.0.dev0"
description = "One contract for the performing family's members, served alone or inside a hub."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
# ShowStopper serves its page with textual-serve, which is aiohttp.
aiohttp = ["aiohttp>=3.9"]

[project.scripts]
hearth = "hearth.conformance:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pluggy>=1.5", "aiohttp>=3.9"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Distributed as qm-hearth, imported as hearth.
module-name = "hearth"

[tool.pytest.ini_options]
# The walkthrough's pages are run as doctests by the ordinary test command.
testpaths = ["tests", "walkthrough"]
addopts = "--doctest-glob=*.md"
pythonpath = ["tests", "template", "demo/plugins"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# As strict as ShowRunner's, so the template passes in the exemplar that copies it.
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# The panel's page is inline HTML and script.
"demo/proposal.py" = ["E501"]
